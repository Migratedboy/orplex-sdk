name: publish

# Releases are published only from CI, with a provenance attestation.
# Tags are created automatically when package.json's version has no tag yet
# (patch bump: 0.5.8 -> 0.5.9 -> ...). A manually pushed tag always wins.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, do not publish"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify-exports.mjs
      - run: node --test --test-concurrency=1 tests/files.test.mjs tests/marketplace.test.mjs tests/marketplace-index-v2.test.mjs tests/mcp-args.test.mjs tests/mcp-env.test.mjs tests/mcp-lifecycle.test.mjs tests/mcp-respawn.test.mjs tests/mcp-routing.test.mjs tests/tools.test.mjs tests/activity-lifecycle.test.mjs tests/loop-engine.test.mjs

      - name: auto-tag if missing
        id: autotag
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "created=false" >> $GITHUB_OUTPUT
          else
            # bump patch, commit, tag
            npm version patch --no-git-tag-version
            NEW=$(node -p "require('./package.json').version")
            TAG="v${NEW}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json 2>/dev/null || true
            git commit -m "chore(release): ${TAG} [skip ci]"
            git tag "$TAG"
            git push origin HEAD:main
            git push origin "$TAG"
            echo "created tag $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
          fi

      - name: publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}